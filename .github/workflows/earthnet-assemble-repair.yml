name: Assemble EarthNet full snapshot repair

on:
  push:
    branches: [earthnet-full-snapshot-repair]
    paths:
      - 'data/earthnet_seed_parts/**'
      - '.github/workflows/earthnet-assemble-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: earthnet-full-snapshot-repair

      - name: Reassemble and validate exact EarthNet snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat \
            data/earthnet_seed_parts/part00.b64 \
            data/earthnet_seed_parts/part01.b64 \
            data/earthnet_seed_parts/part02.b64 \
            data/earthnet_seed_parts/part03a.b64 \
            data/earthnet_seed_parts/part03b1.b64 \
            data/earthnet_seed_parts/part03b2.b64 \
            data/earthnet_seed_parts/part04.b64 \
            data/earthnet_seed_parts/part05.b64 \
            data/earthnet_seed_parts/part06a.b64 \
            data/earthnet_seed_parts/part06b.b64 \
            > /tmp/earthnet_full.b64

          [[ "$(wc -c < /tmp/earthnet_full.b64)" -eq 82028 ]] || {
            echo "Unexpected compressed payload length" >&2
            exit 1
          }
          base64 --decode /tmp/earthnet_full.b64 | gzip -dc > data/earthnet_latest.json
          [[ "$(wc -c < data/earthnet_latest.json)" -eq 743650 ]] || {
            echo "Unexpected EarthNet JSON byte length" >&2
            exit 1
          }
          echo "fec7bc202e3b1644f8fc8606a3d4c9c12eb5eebfa94790cf1351889041d323db  data/earthnet_latest.json" | sha256sum -c -

          python3 - <<'PY'
          import json
          from pathlib import Path

          events = json.loads(Path('data/earthnet_latest.json').read_text(encoding='utf-8'))
          status = json.loads(Path('data/earthnet_status.json').read_text(encoding='utf-8'))

          if not isinstance(events, list):
              raise SystemExit('EarthNet payload is not a list')
          if len(events) != 133:
              raise SystemExit(f'Expected 133 events, found {len(events)}')

          causal = sum(1 for e in events if isinstance(e, dict) and e.get('causal'))
          intelligence = sum(1 for e in events if isinstance(e, dict) and e.get('intelligence'))
          ids = [e.get('id') for e in events if isinstance(e, dict)]

          if causal != 40:
              raise SystemExit(f'Expected 40 causal assessments, found {causal}')
          if intelligence != 76:
              raise SystemExit(f'Expected 76 intelligence assessments, found {intelligence}')
          if len(ids) != 133 or len(set(ids)) != 133 or any(not x for x in ids):
              raise SystemExit('EarthNet event IDs are missing or duplicated')
          if status.get('event_count') != 133 or status.get('source_record_count') != 133:
              raise SystemExit('EarthNet status event count does not match payload')
          if status.get('causal_assessment_count') != 40:
              raise SystemExit('EarthNet status causal count does not match payload')
          if status.get('event_intelligence', {}).get('assessment_count') != 76:
              raise SystemExit('EarthNet status intelligence count does not match payload')

          print('EARTHNET FULL SNAPSHOT: PASS — 133 events / 40 causal / 76 intelligence')
          PY

      - name: Commit exact reconstructed snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Pythology EarthNet Repair"
          git config user.email "brent@pythology.co.nz"
          git add data/earthnet_latest.json
          if git diff --cached --quiet; then
            echo "Exact EarthNet snapshot already committed."
            exit 0
          fi
          git commit -m "data(earthnet): reconstruct exact 133-event snapshot [skip ci]"
          git push origin HEAD:earthnet-full-snapshot-repair
