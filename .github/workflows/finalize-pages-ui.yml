name: Finalize Pythology Pages UI

on:
  workflow_run:
    workflows: ["Deploy Pythology Pages Lab"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI overlay
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download completed Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .pages-source
          github-token: ${{ github.token }}
          repository: PythologyIntelligence/pythology-pages-lab
          run-id: ${{ github.event.workflow_run.id }}

      - name: Extract Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          [[ -s .pages-source/artifact.tar ]] || { echo 'Pages artifact.tar missing' >&2; exit 1; }
          tar -xf .pages-source/artifact.tar -C _site

      - name: Apply deterministic UI overlay
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          VERSION="${SOURCE_SHA:0:12}"
          [[ -n "$VERSION" ]] || VERSION="pages-ui"

          for required in earthnet-map-controls.js mdra.html mdra.css mdra-nav.js mdra-refresh.js mdra-refresh.css; do
            [[ -s "$required" ]] || { echo "$required missing" >&2; exit 1; }
          done
          [[ -s _site/earthnet-global/index.html ]] || { echo 'EarthNet index missing from Pages artifact' >&2; exit 1; }

          cp earthnet-map-controls.js _site/earthnet-global/earthnet-map-controls.js
          cp mdra.html _site/mdra.html
          cp mdra.css _site/mdra.css
          cp mdra-nav.js _site/mdra-nav.js
          cp mdra-refresh.js _site/mdra-refresh.js
          cp mdra-refresh.css _site/mdra-refresh.css

          VERSION="$VERSION" python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ['VERSION']

          def version_asset(source, asset):
              pattern = rf'(["\']){re.escape(asset)}(?:\?v=[^"\']*)?(["\'])'
              return re.sub(pattern, rf'\1{asset}?v={version}\2', source)

          home = Path('_site/index.html')
          if not home.exists():
              raise SystemExit('Homepage missing from Pages artifact')
          text = home.read_text(encoding='utf-8')

          for asset in ('site.css', 'pythology-human.css', 'site.js', 'home-proof.js'):
              text = version_asset(text, asset)

          research_tag = f'<script defer src="research-ui.js?v={version}"></script>'
          if 'research-ui.js' not in text:
              anchor = re.search(r'<script defer src="home-proof\.js\?v=[^"]+"></script>', text)
              if not anchor:
                  raise SystemExit('Could not locate versioned home-proof.js tag')
              text = text[:anchor.start()] + research_tag + '\n  ' + text[anchor.start():]
          else:
              text = version_asset(text, 'research-ui.js')
          home.write_text(text, encoding='utf-8')

          # MDRA is the canonical public front door for the three operating systems.
          # The refresh overlay updates the agreed public copy across the human-facing
          # pages without disturbing the underlying live-product mirrors.
          nav_tag = f'<script defer src="mdra-nav.js?v={version}"></script>'
          refresh_tag = f'<script defer src="mdra-refresh.js?v={version}"></script>'
          refresh_css = f'<link rel="stylesheet" href="mdra-refresh.css?v={version}">'
          for page in Path('_site').glob('*.html'):
              try:
                  page_text = page.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if 'data-nav-links' not in page_text:
                  continue
              page_text = re.sub(r'\s*<script defer src="mdra-nav\.js(?:\?v=[^"]*)?"></script>\s*', '\n', page_text)
              page_text = re.sub(r'\s*<script defer src="mdra-refresh\.js(?:\?v=[^"]*)?"></script>\s*', '\n', page_text)
              page_text = re.sub(r'\s*<link rel="stylesheet" href="mdra-refresh\.css(?:\?v=[^"]*)?">\s*', '\n', page_text)
              if '</head>' not in page_text:
                  raise SystemExit(f'{page} has no closing head tag')
              page_text = page_text.replace('</head>', f'  {refresh_css}\n  {nav_tag}\n  {refresh_tag}\n</head>', 1)
              if page.name == 'mdra.html':
                  page_text = version_asset(page_text, 'mdra.css')
              page.write_text(page_text, encoding='utf-8')

          earth = Path('_site/earthnet-global/index.html')
          earth_text = earth.read_text(encoding='utf-8')
          earth_text = re.sub(
              r'\s*<script defer src="earthnet-map-controls\.js(?:\?v=[^"]*)?"></script>\s*',
              '\n',
              earth_text,
          )
          control_tag = f'  <script defer src="earthnet-map-controls.js?v={version}"></script>\n'
          if '</body>' not in earth_text:
              raise SystemExit('EarthNet index has no closing body tag')
          earth_text = earth_text.replace('</body>', control_tag + '</body>')
          earth.write_text(earth_text, encoding='utf-8')

          final_home = home.read_text(encoding='utf-8')
          final_about = Path('_site/about.html').read_text(encoding='utf-8')
          final_mdra = Path('_site/mdra.html').read_text(encoding='utf-8')
          if f'home-proof.js?v={version}' not in final_home or f'research-ui.js?v={version}' not in final_home:
              raise SystemExit('Homepage cache-busting overlay did not land')
          if f'mdra-nav.js?v={version}' not in final_home or f'mdra-refresh.js?v={version}' not in final_home:
              raise SystemExit('Canonical MDRA UI overlay did not land on homepage')
          if f'mdra-refresh.css?v={version}' not in final_about:
              raise SystemExit('Responsive About refresh CSS did not land')
          if 'EARTHNET 2.0' not in final_mdra or 'ATLAS 2.0' not in final_mdra or 'ARCUS' not in final_mdra:
              raise SystemExit('MDRA operating trio validation failed')
          if 'https://earthnet.pythology.co.nz/' not in final_mdra:
              raise SystemExit('EarthNet 2.0 public URL missing from MDRA')
          if f'earthnet-map-controls.js?v={version}' not in earth_text:
              raise SystemExit('EarthNet control overlay did not land')

          controls = Path('_site/earthnet-global/earthnet-map-controls.js').read_text(encoding='utf-8')
          for required in ('Clouds on', 'Cloud 55%', 'earthnet-home-button'):
              if required not in controls:
                  raise SystemExit(f'EarthNet UI overlay validation failed: {required}')

          proof = Path('_site/home-proof.js').read_text(encoding='utf-8')
          if 'data:image/webp;base64' not in proof:
              raise SystemExit('Homepage NZ artwork payload is missing from home-proof.js')

          print(f'MDRA architecture refresh validated for Pages source {version}.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload finalized site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy finalized site
        id: deployment
        uses: actions/deploy-pages@v4
