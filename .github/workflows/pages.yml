name: Deploy Pythology Pages Lab

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Pythology system health"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build public lab mirror with resilient fallback
        shell: bash
        run: |
          if bash scripts/build-lab.sh; then
            echo "Primary Pythology source mirror succeeded."
          else
            echo "Primary Pythology source unavailable; preserving the last-good Pages deployment."
            bash scripts/build-pages-fallback.sh
          fi

      - name: Surface live EarthNet on homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          page = Path('_site/index.html')
          if not page.exists():
              print('::warning::Homepage was not present; skipping live EarthNet promotion.')
              raise SystemExit(0)

          version = os.environ.get('GITHUB_SHA', 'earthnet')[:12]
          live = f'earthnet-global/?v={version}'
          text = page.read_text(encoding='utf-8')

          replacements = [
              ('<a class="btn btn-primary" href="research.html">Explore research</a>',
               f'<a class="btn btn-primary" href="{live}">LIVE EARTHNET</a>'),
              ('<a class="btn" href="earthnet-platform.html">Explore EarthNet</a>',
               f'<a class="btn" href="{live}">Open Live EarthNet</a>'),
              ('<a class="domain-card" href="earthnet-platform.html" style="--domain-image:url(\'png_images/earthnet.png\')">',
               f'<a class="domain-card" href="{live}" style="--domain-image:url(\'png_images/earthnet.png\')">'),
              ('<span class="card-arrow">Explore EarthNet →</span>',
               '<span class="card-arrow">Open Live EarthNet →</span>'),
          ]
          for old, new in replacements:
              text = text.replace(old, new)

          # If the self-mirrored homepage already contains a previous live link,
          # refresh its version rather than stacking another patch.
          import re
          text = re.sub(r'earthnet-global/\?v=[A-Za-z0-9._-]+', live, text)

          page.write_text(text, encoding='utf-8')
          if 'LIVE EARTHNET' not in text or 'Open Live EarthNet' not in text:
              print('::warning::Homepage live EarthNet promotion did not match all expected controls.')
          else:
              print(f'Homepage now promotes live EarthNet at {live}.')
          PY

      - name: Overlay canonical EarthNet from GitHub repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/data _site/earthnet-global

          if [[ -d earthnet-global ]]; then
            rm -rf _site/earthnet-global
            cp -a earthnet-global _site/earthnet-global
            echo "Staged canonical EarthNet Global bundle from GitHub."
          else
            echo "::warning::No repository EarthNet Global bundle found; retaining mirrored fallback."
          fi

          declare -A EARTH_TEXTURES=(
            [earth_atmos_2048.jpg]="https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg"
            [earth_normal_2048.jpg]="https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_normal_2048.jpg"
            [earth_specular_2048.jpg]="https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_specular_2048.jpg"
            [earth_clouds_1024.png]="https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_clouds_1024.png"
          )
          for file in "${!EARTH_TEXTURES[@]}"; do
            if [[ ! -s "_site/earthnet-global/$file" ]]; then
              curl --fail --silent --show-error --location --retry 3 --connect-timeout 10 --max-time 30 \
                "${EARTH_TEXTURES[$file]}" -o "_site/earthnet-global/$file"
              echo "Restored EarthNet texture in Pages build: $file"
            fi
          done

          # Normalise EarthNet runtime paths. Repeated self-mirroring had
          # accumulated prefixes such as ......../data/ and ......../earthnet-global/.
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('_site/earthnet-global')
          changed = 0
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js', '.mjs', '.css'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = re.sub(r'\.{4,}/earthnet-global/', '../earthnet-global/', text)
              new = re.sub(r'\.{4,}/data/', '../data/', new)
              new = re.sub(r'(?<!\.)/earthnet-global/', '../earthnet-global/', new)
              new = re.sub(r'(?<!\.)/data/', '../data/', new)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed += 1

          leftovers = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js', '.mjs', '.css'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if re.search(r'\.{4,}/(?:earthnet-global|data)/', text):
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Malformed EarthNet runtime paths remain: ' + ', '.join(leftovers))
          print(f'Normalised EarthNet runtime paths in {changed} file(s).')
          PY

          # The runtime JS is patched after Vite assigned its hashed filename,
          # so force a unique browser/CDN URL for each Pages deployment. Also
          # strip the stale Netlify HUD injected by the former host.
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          index = Path('_site/earthnet-global/index.html')
          version = os.environ.get('GITHUB_SHA', 'earthnet')[:12]
          text = index.read_text(encoding='utf-8')
          text = re.sub(
              r'((?:\.\./|\./)?assets/[^"\']+\.(?:js|css))(?:\?v=[^"\']*)?',
              lambda m: f'{m.group(1)}?v={version}',
              text,
          )
          text = re.sub(
              r'\s*<script[^>]+\.netlify/scripts/hud[^>]*></script>\s*',
              '\n',
              text,
              flags=re.IGNORECASE,
          )
          if f'?v={version}' not in text:
              raise SystemExit('EarthNet cache-buster was not applied to index.html')
          if '.netlify/scripts/hud' in text:
              raise SystemExit('Stale Netlify HUD remains in EarthNet index.html')
          index.write_text(text, encoding='utf-8')
          print(f'Cache-busted EarthNet entrypoint for deploy {version}; removed stale Netlify HUD.')
          PY

          for file in earthnet_latest.json earthnet_status.json earthnet_prometheus.json; do
            if [[ -f "data/$file" ]]; then
              cp "data/$file" "_site/data/$file"
              echo "Staged EarthNet repository snapshot: $file"
            fi
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          latest_path = Path('_site/data/earthnet_latest.json')
          status_path = Path('_site/data/earthnet_status.json')
          if not latest_path.exists() or not status_path.exists():
              raise SystemExit('EarthNet snapshot is missing from the Pages artifact')

          latest = json.loads(latest_path.read_text(encoding='utf-8'))
          status = json.loads(status_path.read_text(encoding='utf-8'))
          if not isinstance(latest, list) or not latest:
              raise SystemExit('EarthNet event snapshot is empty or invalid')
          if not isinstance(status, dict):
              raise SystemExit('EarthNet status snapshot failed validation')

          root = Path('_site/earthnet-global')
          required = [
              root / 'index.html',
              root / 'earth_atmos_2048.jpg',
              root / 'earth_normal_2048.jpg',
              root / 'earth_specular_2048.jpg',
              root / 'earth_clouds_1024.png',
          ]
          missing = [str(path) for path in required if not path.exists() or path.stat().st_size == 0]
          if missing:
              raise SystemExit('EarthNet Global bundle incomplete: ' + ', '.join(missing))

          generated = status.get('generated') or status.get('cycle_completed_at')
          print(f'EarthNet Pages overlay validated: {len(latest)} events; generated {generated}')
          PY

      - name: Stage current safe System Control snapshots
        shell: bash
        run: |
          mkdir -p _site/data _site/monitor
          if [[ -d monitor ]]; then
            cp -a monitor/. _site/monitor/
          fi
          for file in system-health.json yggdrasil_activity.json; do
            if [[ -f "data/$file" ]]; then
              cp "data/$file" "_site/data/$file"
            fi
          done
          python3 - <<'PY'
          from pathlib import Path

          page = Path('_site/monitor/yggdrasil.html')
          if page.exists():
              text = page.read_text(encoding='utf-8')
              tag = '<script defer src="yggdrasil-enhance.js"></script>'
              if tag not in text:
                  text = text.replace('</body>', f'  {tag}\n</body>')
              page.write_text(text, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
