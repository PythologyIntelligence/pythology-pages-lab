name: Deploy Pythology Pages Lab

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Pythology system health"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build public lab mirror
        run: bash scripts/build-lab.sh

      - name: Patch EarthNet for project Pages
        run: |
          mkdir -p _site/earthnet-global _site/data
          for file in earth_atmos_2048.jpg earth_normal_2048.jpg earth_specular_2048.jpg earth_clouds_1024.png; do
            curl -fsSL "https://pythology.co.nz/earthnet-global/$file" -o "_site/earthnet-global/$file"
          done
          curl -fsSL "https://pythology.co.nz/data/earthnet_blob_config.json" -o "_site/data/earthnet_blob_config.json" || true
          python3 - <<'PY'
          from pathlib import Path

          root = Path('_site/earthnet-global')
          prefix = '/pythology-pages-lab'
          replacements = {
              '/earthnet-global/': f'{prefix}/earthnet-global/',
              '/data/': f'{prefix}/data/',
          }

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js', '.mjs', '.css'}:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              new = text
              for old, replacement in replacements.items():
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new)
          PY

      - name: Stage Yggdrasil safe activity snapshot
        run: |
          mkdir -p _site/data
          if [[ -f data/yggdrasil_activity.json ]]; then
            cp data/yggdrasil_activity.json _site/data/yggdrasil_activity.json
          fi
          python3 - <<'PY'
          from pathlib import Path

          page = Path('_site/monitor/yggdrasil.html')
          if page.exists():
              text = page.read_text(encoding='utf-8')
              tag = '<script defer src="yggdrasil-enhance.js"></script>'
              if tag not in text:
                  text = text.replace('</body>', f'  {tag}\n</body>')
              page.write_text(text, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
