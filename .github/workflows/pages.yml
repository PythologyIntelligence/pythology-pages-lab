name: Deploy Pythology Pages Lab

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Pythology system health"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build public lab mirror with resilient fallback
        shell: bash
        run: |
          if bash scripts/build-lab.sh; then
            echo "Primary Pythology source mirror succeeded."
          else
            echo "Primary Pythology source unavailable; preserving the last-good Pages deployment."
            bash scripts/build-pages-fallback.sh
          fi

      - name: Patch EarthNet for Pages and custom domain without making old host a hard dependency
        shell: bash
        run: |
          mkdir -p _site/earthnet-global _site/data
          for file in earth_atmos_2048.jpg earth_normal_2048.jpg earth_specular_2048.jpg earth_clouds_1024.png; do
            tmp="/tmp/$file"
            if curl -fsSL "https://pythology.co.nz/earthnet-global/$file" -o "$tmp"; then
              cp "$tmp" "_site/earthnet-global/$file"
            else
              echo "EarthNet local texture unavailable: $file; browser bundle will use canonical Three.js texture fallback."
            fi
          done
          if curl -fsSL "https://pythology.co.nz/data/earthnet_blob_config.json" -o /tmp/earthnet_blob_config.json; then
            cp /tmp/earthnet_blob_config.json _site/data/earthnet_blob_config.json
          fi
          if [[ -f data/earthnet_status.json ]]; then
            cp data/earthnet_status.json _site/data/earthnet_status.json
          fi
          if [[ ! -f _site/data/earthnet_latest.json && -f data/earthnet_latest.json ]]; then
            cp data/earthnet_latest.json _site/data/earthnet_latest.json
            echo "Staged EarthNet emergency event snapshot from Pages repository."
          fi
          python3 - <<'PY'
          from pathlib import Path

          root = Path('_site/earthnet-global')
          replacements = {
              '/pythology-pages-lab/earthnet-global/': './earthnet-global/',
              '/pythology-pages-lab/data/': './data/',
              '/earthnet-global/': './earthnet-global/',
              '/data/': './data/',
          }
          # The EarthNet Vite bundle constructs the four globe texture URLs from
          # one base template. If the mirrored binary textures are absent, point
          # that template at the canonical Three.js planet textures so EarthNet
          # still renders Earth rather than the untextured blue fallback sphere.
          local_texture_template = '`./earthnet-global/${o}`'
          canonical_texture_template = '`https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/${o}`'

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js', '.mjs', '.css'}:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              new = text
              for old, replacement in replacements.items():
                  new = new.replace(old, replacement)
              new = new.replace(local_texture_template, canonical_texture_template)
              if new != text:
                  path.write_text(new)
          PY

      - name: Stage current safe System Control snapshots
        shell: bash
        run: |
          mkdir -p _site/data _site/monitor
          if [[ -d monitor ]]; then
            cp -a monitor/. _site/monitor/
          fi
          for file in system-health.json yggdrasil_activity.json earthnet_status.json; do
            if [[ -f "data/$file" ]]; then
              cp "data/$file" "_site/data/$file"
            fi
          done
          python3 - <<'PY'
          from pathlib import Path

          page = Path('_site/monitor/yggdrasil.html')
          if page.exists():
              text = page.read_text(encoding='utf-8')
              tag = '<script defer src="yggdrasil-enhance.js"></script>'
              if tag not in text:
                  text = text.replace('</body>', f'  {tag}\n</body>')
              page.write_text(text, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
