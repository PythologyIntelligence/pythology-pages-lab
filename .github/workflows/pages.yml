name: Deploy Pythology Pages Lab

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Pythology system health"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build public lab mirror with resilient fallback
        shell: bash
        run: |
          if bash scripts/build-lab.sh; then
            echo "Primary Pythology source mirror succeeded."
          else
            echo "Primary Pythology source unavailable; preserving the last-good Pages deployment."
            bash scripts/build-pages-fallback.sh
          fi

      - name: Refresh EarthNet safe live snapshot from Cloudflare
        shell: bash
        run: |
          set -u
          EARTHNET_EDGE="https://pythology-staging.brent-d55.workers.dev"
          mkdir -p _site/earthnet-global _site/data /tmp/earthnet-live

          # Prefer the exact EarthNet globe textures already staged by the
          # Cloudflare build. Missing textures are handled by a browser-side
          # canonical Three.js fallback below rather than failing deployment.
          for file in earth_atmos_2048.jpg earth_normal_2048.jpg earth_specular_2048.jpg earth_clouds_1024.png; do
            if curl --fail --silent --show-error --location --retry 2 --connect-timeout 8 --max-time 25 \
              "$EARTHNET_EDGE/earthnet-global/$file" -o "/tmp/earthnet-live/$file"; then
              cp "/tmp/earthnet-live/$file" "_site/earthnet-global/$file"
              echo "EarthNet texture refreshed from Cloudflare: $file"
            else
              echo "::warning::EarthNet edge texture unavailable: $file; browser fallback remains available."
            fi
          done

          LIVE_PAIR=1
          for file in earthnet_latest.json earthnet_status.json; do
            if ! curl --fail --silent --show-error --location --retry 2 --connect-timeout 8 --max-time 30 \
              "$EARTHNET_EDGE/data/$file" -o "/tmp/earthnet-live/$file"; then
              echo "::warning::EarthNet edge snapshot unavailable: $file; retaining safe repository fallback."
              LIVE_PAIR=0
            fi
          done

          if [[ "$LIVE_PAIR" == "1" ]]; then
            python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          tmp = Path('/tmp/earthnet-live')
          out = Path('_site/data')
          latest_path = tmp / 'earthnet_latest.json'
          status_path = tmp / 'earthnet_status.json'

          try:
              latest = json.loads(latest_path.read_text(encoding='utf-8'))
              status = json.loads(status_path.read_text(encoding='utf-8'))
              if not isinstance(latest, list) or len(latest) < 10:
                  raise ValueError(f'event payload contained only {len(latest) if isinstance(latest, list) else "non-list"} events')
              if not isinstance(status, dict):
                  raise ValueError('status payload was not an object')
              status_count = int(status.get('event_count') or 0)
              if status_count < 10:
                  raise ValueError(f'status event_count was {status_count}')

              # Guard against accidentally downgrading the deployment to an
              # older edge snapshot when the repository fallback is newer.
              def parse_time(value):
                  if not value:
                      return None
                  try:
                      return datetime.fromisoformat(str(value).replace('Z', '+00:00')).astimezone(timezone.utc)
                  except Exception:
                      return None

              candidate_time = parse_time(status.get('generated') or status.get('cycle_completed_at'))
              existing_time = None
              existing_status = Path('data/earthnet_status.json')
              if existing_status.exists():
                  try:
                      current = json.loads(existing_status.read_text(encoding='utf-8'))
                      existing_time = parse_time(current.get('generated') or current.get('cycle_completed_at'))
                  except Exception:
                      existing_time = None

              if candidate_time and existing_time and candidate_time < existing_time:
                  print(f'Cloudflare EarthNet snapshot is older ({candidate_time.isoformat()}) than repository fallback ({existing_time.isoformat()}); keeping fallback.')
              else:
                  out.mkdir(parents=True, exist_ok=True)
                  (out / 'earthnet_latest.json').write_text(json.dumps(latest, ensure_ascii=False), encoding='utf-8')
                  (out / 'earthnet_status.json').write_text(json.dumps(status, ensure_ascii=False, indent=2), encoding='utf-8')
                  bridge = {
                      'schema': 'earthnet.pages-bridge.v1',
                      'source': 'cloudflare-staging-safe-static-assets',
                      'synced_at': datetime.now(timezone.utc).isoformat(),
                      'source_generated_at': status.get('generated') or status.get('cycle_completed_at'),
                      'event_count': len(latest),
                      'status_event_count': status_count,
                      'fallback': False,
                  }
                  (out / 'earthnet_bridge.json').write_text(json.dumps(bridge, indent=2), encoding='utf-8')
                  print(f"EarthNet live bridge accepted: {len(latest)} events; source generated {bridge['source_generated_at']}")
          except Exception as exc:
              print(f'::warning::EarthNet edge snapshot failed validation: {exc}; retaining repository fallback.')
          PY
          fi

          # Safe last-resort snapshots. These are intentionally committed in
          # the public Pages repository so an upstream outage never leaves an
          # empty EarthNet globe.
          if [[ ! -f _site/data/earthnet_latest.json && -f data/earthnet_latest.json ]]; then
            cp data/earthnet_latest.json _site/data/earthnet_latest.json
            echo "Staged EarthNet emergency event snapshot from Pages repository."
          fi
          if [[ ! -f _site/data/earthnet_status.json && -f data/earthnet_status.json ]]; then
            cp data/earthnet_status.json _site/data/earthnet_status.json
            echo "Staged EarthNet emergency status snapshot from Pages repository."
          fi

          python3 - <<'PY'
          from pathlib import Path

          root = Path('_site/earthnet-global')
          replacements = {
              '/pythology-pages-lab/earthnet-global/': './earthnet-global/',
              '/pythology-pages-lab/data/': './data/',
              '/earthnet-global/': './earthnet-global/',
              '/data/': './data/',
          }

          local_texture_template = '`./earthnet-global/${o}`'
          canonical_texture_template = '`https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/${o}`'
          local_texture_ready = (root / 'earth_atmos_2048.jpg').exists()

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js', '.mjs', '.css'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, replacement in replacements.items():
                  new = new.replace(old, replacement)
              if not local_texture_ready:
                  new = new.replace(local_texture_template, canonical_texture_template)
              if new != text:
                  path.write_text(new, encoding='utf-8')

          print('EarthNet texture mode:', 'local Cloudflare copy' if local_texture_ready else 'canonical browser fallback')
          PY

      - name: Stage current safe System Control snapshots
        shell: bash
        run: |
          mkdir -p _site/data _site/monitor
          if [[ -d monitor ]]; then
            cp -a monitor/. _site/monitor/
          fi
          # Do not overwrite EarthNet's freshly validated deployment snapshot
          # with the repository fallback here.
          for file in system-health.json yggdrasil_activity.json; do
            if [[ -f "data/$file" ]]; then
              cp "data/$file" "_site/data/$file"
            fi
          done
          python3 - <<'PY'
          from pathlib import Path

          page = Path('_site/monitor/yggdrasil.html')
          if page.exists():
              text = page.read_text(encoding='utf-8')
              tag = '<script defer src="yggdrasil-enhance.js"></script>'
              if tag not in text:
                  text = text.replace('</body>', f'  {tag}\n</body>')
              page.write_text(text, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
