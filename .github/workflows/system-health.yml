name: Pythology system health

on:
  push:
    branches:
      - main
    paths:
      - "scripts/check-system-health.mjs"
      - "scripts/merge-yggdrasil-health.mjs"
      - "monitor/**"
      - ".github/workflows/system-health.yml"
  schedule:
    # Synthetic provider checks hourly, offset from the top of the hour to avoid congestion.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pythology-system-health
  cancel-in-progress: true

jobs:
  health:
    name: Refresh safe system health snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out Pages lab
        uses: actions/checkout@v4

      - name: Run synthetic health checks
        run: node scripts/check-system-health.mjs

      - name: Merge live Yggdrasil VPS heartbeat
        run: node scripts/merge-yggdrasil-health.mjs

      - name: Publish safe health snapshot
        shell: bash
        run: |
          git config user.name "pythology-health[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/system-health.json
          if git diff --cached --quiet; then
            echo "No health snapshot changes."
            exit 0
          fi
          # This data-only commit cannot recurse into another health run because
          # the push trigger is path-scoped. The Pages workflow separately uses
          # workflow_run to deploy the latest main branch after this job finishes.
          git commit -m "data: refresh Pythology system health"
          git push
