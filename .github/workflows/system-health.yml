name: Pythology system health

on:
  push:
    branches:
      - main
    paths:
      - "scripts/check-system-health.mjs"
      - "scripts/repair-pages-health.mjs"
      - "scripts/merge-helios-health.mjs"
      - "scripts/merge-atlas-hydra-health.mjs"
      - "scripts/merge-yggdrasil-health.mjs"
      - "scripts/build-lab.sh"
      - "monitor/**"
      - "sentinel-command.html"
      - "sentinel-command.css"
      - "sentinel-command.js"
      - ".github/workflows/system-health.yml"
  schedule:
    # Synthetic provider checks hourly, offset from the top of the hour to avoid congestion.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pythology-system-health
  cancel-in-progress: true

jobs:
  health:
    name: Refresh safe system health snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out Pages lab
        uses: actions/checkout@v4

      - name: Run synthetic health checks
        run: node scripts/check-system-health.mjs

      - name: Prefer resilient GitHub Pages health surfaces
        run: node scripts/repair-pages-health.mjs

      - name: Merge live Helios VPS health
        run: node scripts/merge-helios-health.mjs

      - name: Merge live Atlas and Hydra VPS health
        run: node scripts/merge-atlas-hydra-health.mjs

      - name: Merge live Yggdrasil VPS heartbeat
        run: node scripts/merge-yggdrasil-health.mjs

      - name: Publish safe health snapshot
        shell: bash
        run: |
          git config user.name "pythology-health[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/system-health.json
          if git diff --cached --quiet; then
            echo "No health snapshot changes."
            exit 0
          fi
          git commit -m "data: refresh Pythology system health"
          git push
