name: Import EarthNet image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-earthnet-image.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy EarthNet artwork from production repository
        shell: bash
        run: |
          mkdir -p png_images
          curl -fL 'https://raw.githubusercontent.com/PythologyIntelligence/pythologyintelligence.github.io/main/png_images/earthnet.png' -o png_images/earthnet.png
          test -s png_images/earthnet.png
      - name: Commit EarthNet artwork
        shell: bash
        run: |
          git config user.name "pythology-assets[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add png_images/earthnet.png
          git diff --cached --quiet || git commit -m "assets: import EarthNet artwork"
          git push
