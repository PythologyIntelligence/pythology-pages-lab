name: Finish Sentinel Pages staging repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-sentinel-command.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest Pages repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add Sentinel to approved public overrides
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/build-lab.sh')
          text = path.read_text(encoding='utf-8')
          needle = '''  cerberus.html
)'''
          replacement = '''  cerberus.html
  sentinel-command.html
  sentinel-command.css
  sentinel-command.js
)'''
          if replacement in text:
              print('Sentinel overrides already staged.')
          elif needle in text:
              text = text.replace(needle, replacement, 1)
              path.write_text(text, encoding='utf-8')
              print('Sentinel overrides added.')
          else:
              raise SystemExit('Could not locate PUBLIC_OVERRIDES insertion point; refusing to modify build-lab.sh')

      - name: Verify Sentinel source files
        shell: bash
        run: |
          set -euo pipefail
          test -s sentinel-command.html
          test -s sentinel-command.css
          test -s sentinel-command.js
          grep -Fq 'sentinel-command.html' scripts/build-lab.sh
          grep -Fq 'sentinel-command.css' scripts/build-lab.sh
          grep -Fq 'sentinel-command.js' scripts/build-lab.sh

      - name: Commit staging repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Pythology Fleet Repair"
          git config user.email "brent@pythology.co.nz"
          git add scripts/build-lab.sh
          git rm .github/workflows/restore-sentinel-command.yml
          git commit -m "fix: stage Sentinel command centre in Pages build"
          git push
