name: Install Pythology Title Banner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-pythology-title-banner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live Pages repository
        uses: actions/checkout@v4

      - name: Put approved banner at the top without changing live copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          style = '''\n  <style id="pythology-title-banner-style">\n    .home-title-banner {\n      position: relative;\n      overflow: hidden;\n      padding: clamp(10px, 1.4vw, 22px);\n      background: radial-gradient(circle at 50% 0%, rgba(84,224,177,.09), transparent 42%), #03080a;\n      border-bottom: 1px solid rgba(143,217,231,.14);\n      isolation: isolate;\n    }\n    .home-title-banner::before {\n      content: '';\n      position: absolute;\n      z-index: -1;\n      inset: -25% 8% 0;\n      background: radial-gradient(ellipse at center, rgba(47,203,151,.12), transparent 64%);\n      filter: blur(28px);\n      pointer-events: none;\n    }\n    .home-title-banner-frame {\n      position: relative;\n      width: min(100%, 1800px);\n      margin: 0 auto;\n      overflow: hidden;\n      border: 1px solid rgba(143,217,231,.18);\n      border-radius: clamp(12px, 1.4vw, 24px);\n      background: #020607;\n      box-shadow: 0 30px 90px rgba(0,0,0,.52), 0 0 70px rgba(47,203,151,.08);\n    }\n    .home-title-banner img {\n      display: block;\n      width: 100%;\n      height: auto;\n      object-fit: contain;\n      filter: saturate(1.04) contrast(1.02);\n    }\n    @media (max-width: 680px) {\n      .home-title-banner { padding: 0; }\n      .home-title-banner-frame { width: 100%; border-inline: 0; border-radius: 0; box-shadow: 0 18px 54px rgba(0,0,0,.48); }\n    }\n  </style>\n'''
          if 'id="pythology-title-banner-style"' not in html:
              html = html.replace('</head>', style + '</head>', 1)

          banner = '''\n  <section class="home-title-banner" aria-label="Pythology Environmental AI Systems">\n    <div class="home-title-banner-frame">\n      <img src="https://raw.githubusercontent.com/PythologyIntelligence/pythologyintelligence.github.io/main/png_images/file_000000009b0c820bb7c25cd80f501580.png" alt="Pythology Environmental AI Systems — Monitor, Model, Predict, Protect" width="1672" height="941" fetchpriority="high">\n    </div>\n  </section>\n'''
          if '<section class="home-title-banner"' not in html:
              html = html.replace('<main>', '<main>' + banner, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit banner and remove installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pythology Pages'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/install-pythology-title-banner.yml
          git commit -m 'home: add Pythology environmental AI title banner'
          git push
