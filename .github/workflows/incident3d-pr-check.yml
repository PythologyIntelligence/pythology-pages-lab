name: Validate EarthNet Incident 3D PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'earthnet2/incident3d/**'
      - 'earthnet2/app/panel.js'
      - 'scripts/build-enviroarc-pages.mjs'
      - '.github/workflows/pages.yml'
      - '.github/workflows/incident3d-pr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Verify 3D package and evidence contracts (no deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JavaScript syntax and routing contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            earthnet2/incident3d/main.js \
            earthnet2/incident3d/incident-data.js \
            earthnet2/incident3d/storm-footprint.js \
            earthnet2/app/panel.js \
            scripts/build-enviroarc-pages.mjs; do
            node --check "$file"
          done
          test -s earthnet2/incident3d/index.html
          grep -Fq 'href="./incident3d/index.html?id=' earthnet2/app/panel.js
          grep -Fq '../media/feed/feed.json' earthnet2/incident3d/main.js
          grep -Fq '../vendor/openglobus/og.es.js' earthnet2/incident3d/main.js

      - name: Exercise data integrity and temporal screening
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {normalizeIncident, usableResearchSnapshot, playback} from './earthnet2/incident3d/incident-data.js';
          import {normalizeWindFields,windFootprintGeoJSON} from './earthnet2/incident3d/storm-footprint.js';
          const now='2026-10-18T03:30:00Z';
          const a=normalizeIncident({id:'sample',category:'wildfire',lat:-39.3,lon:175.4,source:'example',updatedAt:now}, {}, {});
          assert.equal(a.geometry.length,0);
          assert.equal(a.assessment,null);
          assert.equal(playback(a).kind,'none');
          const fields=normalizeWindFields([{
            thresholdKt:34,evidenceClass:'hypothetical',source:'explicit unit test',
            quadrantsNm:{NE:60,SE:50,SW:40,NW:50}
          }],now);
          assert.equal(fields.length,1);
          assert.equal(windFootprintGeoJSON(173.5,-34.7,fields[0]).type,'Polygon');
          const envelope={
            schemaVersion:1,
            meta:{
              producer:'Prometheus Subterranean / EnviroArc research bridge',
              methodology:'deterministic source-record screening; unvalidated; no hazard predictions',
              generatedAt:now,sourceGeneratedAt:now,
              containsForecasts:false,containsApprovedInterventions:false,realTime:false
            },incidents:{
              sample:{frames:[],overlays:[],assessment:{
                status:'research',source:'Prometheus EnviroArc evidence screen v1 (deterministic, not a causal model)',
                summary:'Source facts only',evidenceRefs:['earthnet-event:sample']
              }}
            }
          };
          assert.equal(usableResearchSnapshot(envelope,now,Date.parse(now)).status,'available');
          const invalid=structuredClone(envelope);
          invalid.meta.containsForecasts=true;
          assert.equal(usableResearchSnapshot(invalid,now,Date.parse(now)).status,'invalid');
          console.log('3D evidence safety smoke test passed');
          JS

      - name: Verify source-only fire evolution and independent burn-state polygons
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-incident3d-fire.mjs scripts/test-prometheus-pages.mjs scripts/test-incident3d-nifc.mjs scripts/test-incident3d-feds.mjs scripts/test-earthnet-3d-nav.mjs
          node --check earthnet2/incident3d/fire-evolution.js
          node --check earthnet2/incident3d/nifc-perimeters.js
          node --check earthnet2/incident3d/nasa-feds.js
          node --check scripts/prometheus-enviroarc-screening.mjs

      - name: Confirm pinned OpenGlobus package contents and licence
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/openglobus-pr"
          npm install --prefix "$DEST" --no-save --ignore-scripts --no-audit --no-fund '@openglobus/og@0.28.7'
          SRC="$DEST/node_modules/@openglobus/og"
          node -e 'const p=require(process.argv[1]);if(p.version!=="0.28.7"||p.license!=="MIT")process.exit(1)' "$SRC/package.json"
          for asset in og.es.js og.css; do test -s "$SRC/lib/$asset"; done
          test -s "$SRC/LICENSE.md"
          echo 'Pinned OpenGlobus distribution is available and properly licensed.'
