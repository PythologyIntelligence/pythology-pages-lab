name: Make Pythology Title Banner Durable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/make-title-banner-durable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live Pages repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch the real Pages build artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PATCHPY'
          from pathlib import Path

          path = Path('.github/workflows/pages.yml')
          text = path.read_text(encoding='utf-8')
          marker = '      - name: Configure Pages\n'
          step_name = 'Install Pythology title banner into built Pages artifact'

          if step_name not in text:
              if marker not in text:
                  raise SystemExit('Configure Pages marker not found')
              step = '''      - name: Install Pythology title banner into built Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/png_images
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 10 --max-time 60 \
            'https://raw.githubusercontent.com/PythologyIntelligence/pythologyintelligence.github.io/main/png_images/file_000000009b0c820bb7c25cd80f501580.png' \
            -o _site/png_images/pythology_environmental_ai_banner.png
          python3 - <<'BANNERPY'
          from pathlib import Path
          import re

          image = Path('_site/png_images/pythology_environmental_ai_banner.png')
          data = image.read_bytes()
          if not data.startswith(b'\\x89PNG\\r\\n\\x1a\\n'):
              raise SystemExit('Approved title banner download is not a PNG')
          if len(data) < 100_000:
              raise SystemExit(f'Approved title banner unexpectedly small: {len(data)} bytes')

          home = Path('_site/index.html')
          if not home.exists():
              raise SystemExit('Homepage missing from Pages build')
          html = home.read_text(encoding='utf-8')

          preload = '<link rel="preload" as="image" href="png_images/pythology_environmental_ai_banner.png">'
          if preload not in html:
              html = html.replace('</head>', f'  {preload}\\n</head>', 1)

          style = '''\n  <style id="pythology-title-banner-style">\n    .home-title-banner {\n      position: relative;\n      overflow: hidden;\n      padding: clamp(10px, 1.4vw, 22px);\n      background: radial-gradient(circle at 50% 0%, rgba(84,224,177,.09), transparent 42%), #03080a;\n      border-bottom: 1px solid rgba(143,217,231,.14);\n      isolation: isolate;\n    }\n    .home-title-banner::before {\n      content: '';\n      position: absolute;\n      z-index: -1;\n      inset: -25% 8% 0;\n      background: radial-gradient(ellipse at center, rgba(47,203,151,.12), transparent 64%);\n      filter: blur(28px);\n      pointer-events: none;\n    }\n    .home-title-banner-frame {\n      position: relative;\n      width: min(100%, 1800px);\n      margin: 0 auto;\n      overflow: hidden;\n      border: 1px solid rgba(143,217,231,.18);\n      border-radius: clamp(12px, 1.4vw, 24px);\n      background: #020607;\n      box-shadow: 0 30px 90px rgba(0,0,0,.52), 0 0 70px rgba(47,203,151,.08);\n    }\n    .home-title-banner img {\n      display: block;\n      width: 100%;\n      height: auto;\n      object-fit: contain;\n      filter: saturate(1.04) contrast(1.02);\n    }\n    @media (max-width: 680px) {\n      .home-title-banner { padding: 0; }\n      .home-title-banner-frame {\n        width: 100%;\n        border-inline: 0;\n        border-radius: 0;\n        box-shadow: 0 18px 54px rgba(0,0,0,.48);\n      }\n    }\n  </style>\n'''
          if 'id="pythology-title-banner-style"' not in html:
              html = html.replace('</head>', style + '</head>', 1)

          banner = '''\n  <section class="home-title-banner" aria-label="Pythology Environmental AI Systems">\n    <div class="home-title-banner-frame">\n      <img src="png_images/pythology_environmental_ai_banner.png" alt="Pythology Environmental AI Systems — Monitor, Model, Predict, Protect" width="1672" height="941" fetchpriority="high">\n    </div>\n  </section>\n'''
          if '<section class="home-title-banner"' not in html:
              match = re.search(r'<main(?:\\s[^>]*)?>', html, flags=re.IGNORECASE)
              if match:
                  html = html[:match.end()] + banner + html[match.end():]
              elif '</header>' in html:
                  html = html.replace('</header>', '</header>' + banner, 1)
              else:
                  html = html.replace('<body>', '<body>' + banner, 1)

          home.write_text(html, encoding='utf-8')
          print(f'Pythology title banner installed into Pages artifact: {len(data):,} bytes')
          BANNERPY

'''
              path.write_text(text.replace(marker, step + marker, 1), encoding='utf-8')
              print('Pages pipeline patched.')
          else:
              print('Pages pipeline already contains durable title-banner step.')
          PATCHPY

      - name: Commit durable fix and remove patcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pythology Pages'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/pages.yml
          git rm .github/workflows/make-title-banner-durable.yml
          git commit -m 'pages: install Pythology title banner in deployed artifact'
          git push
