name: Fix Pythology Title Banner Path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/make-title-banner-durable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live Pages repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Point homepage at local public banner asset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'https://raw.githubusercontent.com/PythologyIntelligence/pythologyintelligence.github.io/main/png_images/file_000000009b0c820bb7c25cd80f501580.png'
          new = 'png_images/pythology_environmental_ai_banner.webp'

          if new in text:
              print('Homepage already points at the local banner asset.')
          elif old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Homepage banner path fixed.')
          else:
              raise SystemExit('Expected title-banner source was not found in index.html')
          PY

      - name: Commit homepage path fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No homepage change required.'
            exit 0
          fi
          git config user.name 'Pythology Pages'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'home: use local Pythology title banner asset'
          git push
