name: Stage Pythology Title Banner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/make-title-banner-durable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live Pages repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Stage local title banner in Pages build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/build-lab.sh')
          text = path.read_text(encoding='utf-8')
          marker = '# These public evidence projections are deliberately staged with the humanised\n'
          signature = '# Stage the approved Pythology title banner from this public Pages repository.\n'

          if signature in text:
              print('Title-banner staging is already present.')
          else:
              if marker not in text:
                  raise SystemExit('Public evidence staging marker not found in build-lab.sh')
              block = '''# Stage the approved Pythology title banner from this public Pages repository.\nTITLE_BANNER="$ROOT/png_images/pythology_environmental_ai_banner.webp"\nif [[ ! -s "$TITLE_BANNER" ]]; then\n  echo "Required Pythology title banner missing: $TITLE_BANNER" >&2\n  exit 1\nfi\nmkdir -p "$OUT/png_images"\ncp "$TITLE_BANNER" "$OUT/png_images/pythology_environmental_ai_banner.webp"\n\n'''
              path.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')
              print('Pages build now stages the local title banner.')
          PY

      - name: Commit build staging fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/build-lab.sh; then
            echo 'No build-script change required.'
            exit 0
          fi
          git config user.name 'Pythology Pages'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/build-lab.sh
          git commit -m 'pages: stage local Pythology title banner asset'
          git push
